<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AxBOTS</title>
</head>
<body>
  <main>
    <h1>AxBOTS</h1>
    <p>Актуальная версия: <strong id="version">загрузка…</strong></p>
    <p><a href="./version.json">Открыть version.json</a></p>
    <p><a id="install" href="https://boosty.to/timediscrition">Перейти к установке</a></p>
  </main>
  <script>
    fetch("./version.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        document.getElementById("version").textContent = data.version;
        document.getElementById("install").href = data.download_url;
      })
      .catch(() => {
        document.getElementById("version").textContent = "недоступна";
      });
  </script>
</body>
</html>
